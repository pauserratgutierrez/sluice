# Publish @pauserratgutierrez/sluice-js to the public npm registry.
#
# Same semver tags as the server image (v0.1.0, …).
# Auth: npm trusted publishing (OIDC) once the package exists; optional
# NPM_TOKEN secret only for the first create (npm returns E404 without auth
# when the package is missing and no trusted publisher can be attached yet).
# Docs: https://docs.npmjs.com/trusted-publishers/

name: Release SDK

run-name: Release SDK ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

# Match scraply: OIDC at workflow scope. contents:read for checkout.
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: packages/sluice-js

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache the package manager for release publishes (npm trusted-publishing docs).
          package-manager-cache: false

      # Trusted publishing needs npm CLI ≥ 11.5.1 (and Node ≥ 22.14).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # --allow-same-version: package.json may already match the tag on the
          # release commit; without it npm exits "Version not changed".
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "Publishing @pauserratgutierrez/sluice-js@$version"

      - name: Test
        run: npm test

      - name: Publish to npm
        env:
          # Optional. Required only for the first publish of a new package name
          # (trusted publisher is configured on an existing package page).
          # After OIDC works, delete the repo secret so this stays empty —
          # npm prefers OIDC when available, then falls back to the token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            unset NODE_AUTH_TOKEN
            echo "Auth: OIDC trusted publishing (no NPM_TOKEN)."
          else
            echo "Auth: NPM_TOKEN present (first-publish / fallback)."
          fi
          npm publish --access public
